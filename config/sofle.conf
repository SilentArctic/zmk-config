# ============================================================
#               SilentArctic SOFLE CONFIGURATION              
# ============================================================

CONFIG_ZMK_KEYBOARD_NAME="SilentArctic_Sofle"

# ============================================================
#                           BATTERY
# ============================================================

CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# fix errors with windows battery support
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Peripheral Battery Monitoring (report both halves to computer, if OS supports it)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ============================================================
#                          BLUETOOTH
# ============================================================

# Increase BT transmit power (minimal battery impact)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLE adjustments for batter L/R latency (eager mode for faster response)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Connection intervals (lower = more responsive, higher = better battery)
# Interval = value * 1.25 ms
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# ============================================================
#                         OLED (DISABLED)
# ============================================================
#        IMPORTANT: Only enable RGB OR OLED, not both!        
# ============================================================

# CONFIG_ZMK_DISPLAY=y
# CONFIG_I2C=y
# CONFIG_SSD1306=y
# CONFIG_ZMK_EXT_POWER=y
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# ============================================================
#                         RGB (ENABLED)                      
# ============================================================
#        IMPORTANT: Only enable RGB OR OLED, not both!
# ============================================================

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60

# ============================================================
#                       POWER MANAGEMENT                      
# ============================================================

# Deep sleep configuration
CONFIG_ZMK_SLEEP=y

# Idle sleep timeout: 10 minutes (in milliseconds)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Idle timeout: 30 seconds (in milliseconds)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# ============================================================
#                          ZMK Studio                          
# ============================================================

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ============================================================
#                           Encoders
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
